name: Release Workflow

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: Semantic version (e.g., "1.0.0", "2.1.3")
      target_branch:
        description: 'Branch to release version on (main default, release/vX for older majors, or type custom branch name)'
        required: true
        type: string
        default: main

permissions:
  contents: write
  actions: write

concurrency:
  group: release-workflow
  cancel-in-progress: false

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      MAJOR_VERSION: ${{ steps.extract-major-version.outputs.MAJOR_VERSION }}
    steps:
      - name: Setup SSH
        if: ${{ !env.ACT }}
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.BOT_SSH_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          fetch-tags: false  # Disabled to prevent remote tag fetching during act tests
          token: ${{ secrets.GITHUB_TOKEN != '' && secrets.GITHUB_TOKEN || env.TOKEN_FALLBACK }}

      # Restore commit objects from bundle before restoring tags. This ensures all commit
      # SHAs referenced by tags exist in the repository. The bundle is created by
      # Setup-TestScenario.ps1 during test setup.
      - name: Restore test commits when running under act
        if: ${{ env.ACT }}
        shell: bash
        run: |
          echo "📦 Running under act - checking for test commits bundle"
          
          echo "📋 Git log BEFORE unbundle:"
          git log --oneline -n 5 || echo "No commits"
          
          BUNDLE_FILE="${TEST_STATE_PATH:-/tmp/test-state}/test-commits.bundle"
          
          # Fallback: if test-commits.bundle doesn't exist, try to find timestamped bundle
          if [[ ! -f "$BUNDLE_FILE" ]]; then
            echo "⚠️ test-commits.bundle not found, checking for timestamped bundles..."
            TIMESTAMPED_BUNDLE=$(find "${TEST_STATE_PATH:-/tmp/test-state}" -maxdepth 1 -type f -name 'commits-*.bundle' -printf '%T@ %p\n' 2>/dev/null \
              | sort -rn | head -n1 | cut -d' ' -f2-)
            if [[ -n "$TIMESTAMPED_BUNDLE" && -f "$TIMESTAMPED_BUNDLE" ]]; then
              BUNDLE_FILE="$TIMESTAMPED_BUNDLE"
              echo "📦 Found timestamped bundle: $BUNDLE_FILE"
            fi
          fi
          
          if [[ -f "$BUNDLE_FILE" ]]; then
            echo "📦 Found test commits bundle: $BUNDLE_FILE"
            
            # Check if bundle file is empty (created for empty repositories)
            if [[ ! -s "$BUNDLE_FILE" ]]; then
              echo "⚠️ Bundle file is empty (no commits to restore)"
            else
              echo "🔍 Verifying bundle integrity..."
              if git bundle verify "$BUNDLE_FILE" 2>&1; then
                echo "✅ Bundle verification passed"
              else
                echo "⚠️ Bundle verification failed, attempting unbundle anyway"
              fi
              
              echo "📦 Unbundling commits..."
              UNBUNDLE_OUTPUT=$(git bundle unbundle "$BUNDLE_FILE" 2>&1 || true)
              echo "$UNBUNDLE_OUTPUT"
              
              # Count refs unbundled
              REF_COUNT=$(echo "$UNBUNDLE_OUTPUT" | grep -c '^\s*[a-f0-9]\{40\}\s' || echo "0")
              echo "✅ Test commits restored from bundle ($REF_COUNT refs unbundled)"
            fi
          else
            echo "⚠️ No test commits bundle found at ${TEST_STATE_PATH:-/tmp/test-state}/test-commits.bundle"
            echo "⚠️ No timestamped commits-*.bundle files found"
            echo "✅ Clean state - no commits bundle (correct for first release or scenarios without commits)"
          fi
          
          echo "📋 Git log AFTER unbundle:"
          git log --oneline -n 5 || echo "No commits"

      - name: Setup test tags when running under act
        if: ${{ env.ACT }}
        shell: bash
        run: |
          # When running under act, restore test tags from metadata file
          echo "Running under act - restoring test tags"
          
          echo "📋 Git tags BEFORE cleanup:"
          git tag -l || echo "No tags"
          
          # Delete all existing tags to ensure clean state
          echo "🧹 Cleaning all existing tags..."
          git tag -l | xargs -r git tag -d 2>/dev/null || true
          
          echo "📋 Git tags AFTER cleanup:"
          git tag -l || echo "No tags"
          
          TAG_FILE="${TEST_STATE_PATH:-/tmp/test-state}/test-tags.txt"
          if [[ -f "$TAG_FILE" ]]; then
            echo "📋 Found test tags file: $TAG_FILE"
            echo "📋 Contents of test-tags.txt:"
            cat "$TAG_FILE"
            echo "---"
            
            while IFS=' ' read -r tag_name commit_sha; do
              if [[ -n "$tag_name" ]] && [[ -n "$commit_sha" ]]; then
                commit_sha=$(echo "$commit_sha" | tr -d '\r')
                echo "Creating test tag: $tag_name at $commit_sha"
                git tag "$tag_name" "$commit_sha" 2>/dev/null || echo "Tag $tag_name already exists"
              fi
            done < "$TAG_FILE"
            echo "✅ Test tags restored from file"
          else
            echo "⚠️ No test tags file found at $TAG_FILE"
            echo "✅ Clean state - no tags (correct for first release)"
          fi
          
          echo "📋 Git tags FINAL:"
          git tag -l || echo "No tags"

      - name: Setup test branches when running under act
        if: ${{ env.ACT }}
        shell: bash
        run: |
          echo "🌳 Running under act - restoring test branches"
          
          echo "📋 Git branches BEFORE cleanup:"
          git branch -a || echo "No branches"
          
          echo "🧹 Cleaning all existing local branches..."
          git branch | grep -v "^\*" | xargs -r git branch -D 2>/dev/null || true
          
          echo "📋 Git branches AFTER cleanup:"
          git branch -a || echo "No branches"
          
          BRANCH_FILE="${TEST_STATE_PATH:-/tmp/test-state}/test-branches.txt"
          
          if [[ -f "$BRANCH_FILE" ]]; then
            echo "📋 Found test branches file: $BRANCH_FILE"
            echo "📋 Contents of test-branches.txt:"
            cat "$BRANCH_FILE"
            echo "---"
            
            # Get current branch before loop
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")

            while IFS=' ' read -r branch_name commit_sha; do
              if [[ -n "$branch_name" ]] && [[ -n "$commit_sha" ]]; then
                commit_sha=$(echo "$commit_sha" | tr -d '\r')
                
                # Skip the currently checked out branch (will handle it separately)
                if [[ "$branch_name" == "$CURRENT_BRANCH" ]]; then
                  echo "Skipping currently checked out branch: $branch_name (will update after detaching)"
                  continue
                fi
                
                echo "Creating test branch: $branch_name at $commit_sha"
                git branch -f "$branch_name" "$commit_sha" 2>/dev/null || echo "Failed to create branch $branch_name"
              fi
            done < "$BRANCH_FILE"
            echo "✅ Test branches restored from file"
          else
            echo "⚠️ No test branches file found at $BRANCH_FILE"
            echo "✅ Clean state - no branches (correct for first release)"
          fi
          
          # Checkout the target branch to position HEAD at the test commit
          TARGET_BRANCH="${{ inputs.target_branch }}"
          TARGET_COMMIT_SHA=""  # Initialize variable to store target branch's commit

          echo "🔍 Current HEAD position:"
          CURRENT_HEAD=$(git rev-parse HEAD)
          echo "  Commit: $CURRENT_HEAD"

          # Read the branches file to find the target branch's commit SHA
          if [[ -f "$BRANCH_FILE" ]]; then
            while IFS=' ' read -r branch_name commit_sha; do
              if [[ -n "$branch_name" ]] && [[ -n "$commit_sha" ]]; then
                commit_sha=$(echo "$commit_sha" | tr -d '\r')
                
                # Capture the commit SHA for the target branch
                if [[ "$branch_name" == "$TARGET_BRANCH" ]]; then
                  TARGET_COMMIT_SHA="$commit_sha"
                  echo "📍 Found target branch '$TARGET_BRANCH' should point to: $TARGET_COMMIT_SHA"
                fi
              fi
            done < "$BRANCH_FILE"
          fi

          # Verify the target branch exists and we have its commit SHA
          if git show-ref --verify "refs/heads/$TARGET_BRANCH" > /dev/null 2>&1; then
            if [[ -n "$TARGET_COMMIT_SHA" ]]; then
              echo "🔄 Repositioning branch '$TARGET_BRANCH' to test commit: $TARGET_COMMIT_SHA"
              
              # Detach HEAD first to avoid worktree conflict
              git checkout --detach
              
              # Force-update the branch to point to the test commit
              git branch -f "$TARGET_BRANCH" "$TARGET_COMMIT_SHA"
              
              # Checkout the updated branch
              git checkout "$TARGET_BRANCH"
              
              NEW_HEAD=$(git rev-parse HEAD)
              echo "✅ HEAD now at: $NEW_HEAD"
              
              # Verify we're at the correct commit
              if [[ "$NEW_HEAD" == "$TARGET_COMMIT_SHA" ]]; then
                echo "✅ Branch checkout successful - at test commit"
              else
                echo "⚠️ Warning: HEAD ($NEW_HEAD) doesn't match expected commit ($TARGET_COMMIT_SHA)"
              fi
            else
              echo "⚠️ Target branch $TARGET_BRANCH exists but commit SHA not found in test-branches.txt"
              echo "   Skipping checkout"
            fi
          else
            echo "⚠️ Target branch $TARGET_BRANCH not found in test branches"
            echo "   (This is expected for scenarios without the target branch)"
          fi
          
          echo "📋 Git branches FINAL:"
          git branch -a || echo "No branches"

      - name: Validate version format
        shell: bash
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in semantic versioning format (e.g., 1.0.0, 2.1.3)" >&2
            exit 1
          fi

      - name: Check for existing tag
        shell: bash
        run: |
          if git tag -l "v${{ inputs.version }}" | grep -q "v${{ inputs.version }}"; then
            echo "Error: Tag v${{ inputs.version }} already exists" >&2
            exit 1
          fi

      - name: Configure Git Identity
        run: |
          git config user.name "nntin-bot"
          git config user.email "48604375+nntin-bot@users.noreply.github.com"

      - name: Update release version and fix BOM encoding
        if: ${{ !env.ACT }}
        run: |
          pwsh ./scripts/utils/Update-ModuleVersion.ps1 -Version "${{ inputs.version }}"
          pwsh ./scripts/utils/Fix-BOMEncoding.ps1
          git remote set-url origin git@github.com:nntin/d-flows.git
          git add '*.ps1' '*.psm1' '*.psd1'
          git commit -m "chore: Update release notes for v${{ inputs.version }}"
          git push origin HEAD:${{ inputs.target_branch }}
        shell: pwsh

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$ACT" ]]; then        
            VERSION="v${{ inputs.version }}"
            git tag -a "$VERSION" -f -m "Release $VERSION"
          else
            gh release create "v${{ inputs.version }}" \
              --generate-notes \
              --title "Release v${{ inputs.version }}" \
              --target "${{ inputs.target_branch }}"
          fi

      - name: Extract major version
        id: extract-major-version
        shell: bash
        run: |
          MAJOR_VERSION=$(echo "${{ inputs.version }}" | cut -d. -f1)
          
          if [[ -z "$MAJOR_VERSION" ]]; then
            echo "Error: Failed to extract major version from ${{ inputs.version }}" >&2
            exit 1
          fi
          
          echo "MAJOR_VERSION=$MAJOR_VERSION" >> "$GITHUB_ENV"
          echo "MAJOR_VERSION=$MAJOR_VERSION" >> "$GITHUB_OUTPUT"
          
          # Print distinctive markers for act (ACT_TESTING_MODE)
          # Output to stdout and step summary to ensure visibility
          if [[ -n "$ACT" ]]; then
            echo "OUTPUT: MAJOR_VERSION=$MAJOR_VERSION"
            # Also write to step summary for act compatibility
            echo "OUTPUT: MAJOR_VERSION=$MAJOR_VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create annotated major tag
        shell: bash
        run: |
          git tag -a "v$MAJOR_VERSION" -f -m "Update v$MAJOR_VERSION -> v${{ inputs.version }}"

      - name: Push major tag
        if: ${{ !env.ACT }} # only run if NOT running under act
        shell: bash
        run: |
          git push origin "v$MAJOR_VERSION" --force
      
      - name: Trigger docs workflow
        if: ${{ !env.ACT }} # only run if NOT running under act
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          
          TARGET_BRANCH="${{ inputs.target_branch }}"
          VERSION="${{ inputs.version }}"

          echo "🚀 Triggering docs workflow for v$VERSION on $TARGET_BRANCH" >> "$GITHUB_STEP_SUMMARY"

          # Trigger the docs workflow
          if gh workflow run docs.yml \
            --field version="$VERSION" \
            --ref "$TARGET_BRANCH"; then
            echo "✅ Docs workflow triggered successfully" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Error: Failed to trigger docs workflow" >&2
            echo "❌ **Error:** Failed to trigger docs workflow" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Update step summary with major tag information
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Release Summary
          - ✅ Release created: v${{ inputs.version }}
          - 🏷️ Major tag v$MAJOR_VERSION updated to point to v${{ inputs.version }}
          - 🔗 [View Release](${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ inputs.version }})
          - 🔗 [View Tags](${{ github.server_url }}/${{ github.repository }}/tags)
          EOF
          
          echo "Release created: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ inputs.version }}"
          echo "Major tag v$MAJOR_VERSION updated to point to v${{ inputs.version }}"