name: 'GitHub Step Summary'
description: 'Writes Markdown into the $GITHUB_STEP_SUMMARY file, optionally clearing previous content first.'

inputs:
  title:
    description: 'Optional heading rendered as an H2 before the markdown body; omitted when left blank.'
    required: false
  markdown:
    description: 'Body text appended to the step summary exactly as provided.'
    required: true
  overwrite:
    description: "Set to 'true' to truncate $GITHUB_STEP_SUMMARY before writing; defaults to 'false' so content is appended."
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Write Step Summary
      shell: bash
      env:
        TITLE: ${{ inputs.title }}
        MARKDOWN: ${{ inputs.markdown }}
        OVERWRITE: ${{ inputs.overwrite }}
      run: |
        # Validate GITHUB_STEP_SUMMARY is set
        if [[ -z "$GITHUB_STEP_SUMMARY" ]]; then
          echo "❌ Error: GITHUB_STEP_SUMMARY environment variable is not set" >&2
          exit 1
        fi
        
        # Clear existing summary if overwrite is true
        if [[ "$OVERWRITE" == "true" ]]; then
          echo -n > "$GITHUB_STEP_SUMMARY"
        fi
        
        # Add title as level-2 heading if provided
        if [[ -n "$TITLE" ]]; then
          printf '%s\n' "## $TITLE" >> "$GITHUB_STEP_SUMMARY"
        fi
        
        # Append markdown content
        cat >> "$GITHUB_STEP_SUMMARY" << '__GITHUB_STEP_SUMMARY_EOF__'
        ${{ inputs.markdown }}
        __GITHUB_STEP_SUMMARY_EOF__
        
        # Success message
        echo "✅ Step summary written successfully"
