name: "Setup Red-DiscordBot"
description: "Creates the tinkerer instance config and runs a dry-run to validate authentication before other Red-DiscordBot steps."

inputs:
  token:
    description: "Token passed to `redbot tinkerer --token`; required so the dry-run can authenticate against the Discord API."
    required: true
  prefix:
    description: "Command prefix supplied to the dry-run invocation; defaults to '!'."
    default: "!"
  optional_args:
    description: "Additional CLI switches appended to the dry-run command (for example `--log-level debug`); blank by default."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Red-DiscordBot configuration
      shell: bash
      run: |
        echo "📁 Creating Red-DiscordBot directories"
        mkdir -p ~/.config/Red-DiscordBot

        APP_DIR="$HOME/redbot-app"
        mkdir -p "$APP_DIR/cogs"

        echo "📝 Writing config.json"
        CONFIG_JSON="{\"tinkerer\":{\"DATA_PATH\":\"$APP_DIR\",\"COG_PATH_APPEND\":\"cogs\",\"CORE_PATH_APPEND\":\"core\",\"STORAGE_TYPE\":\"JSON\",\"STORAGE_DETAILS\":{}}}"

        echo "$CONFIG_JSON" > ~/.config/Red-DiscordBot/config.json

    # todo: add input for skipping --dry-run
    # todo: do a check whether token was supplied or not, furthermore sanitize inputs (trailing whitespace, ..) 
    - name: Dry-Run Red-DiscordBot
      shell: bash
      run: |
        echo "🚀 Starting Red-DiscordBot"
        python3 -m redbot tinkerer --token "${{ inputs.token }}" --prefix "${{ inputs.prefix }}" --dry-run ${{ inputs.optional_args }}
