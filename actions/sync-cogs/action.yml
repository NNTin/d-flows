name: Sync Cogs
description: |
  Synchronize Discord bot cogs from a source repository to a destination repository.
  Creates a fork of the destination repository, copies specified cogs to a new branch,
  and opens a pull request with the changes. Supports syncing multiple cogs either in
  a single PR or separate PRs per cog.

inputs:
  source_repo:
    description: Source GitHub repository
    required: true
  source_branch:
    description: Branch of source repository
    required: false
  destination_repo:
    description: Destination GitHub repository (e.g. 'NNTin/d-cogs' or 'owner/repo')
    required: true
  destination_branch:
    description: Branch of destination repository
    required: false
  cog_names:
    description: Comma-separated list of cog names to sync (e.g. 'hotreload,anothercog')
    required: true
  separate_prs:
    description: Create separate pull requests for each cog
    required: false
    default: 'false'
