site_name: d-flows Documentation
site_description: GitHub workflow automation and release management for PowerShell modules
site_author: Tin Nguyen
site_url: https://nntin.github.io/d-flows/
repo_url: https://github.com/nntin/d-flows
repo_name: nntin/d-flows
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Developer Guide: developer.md
  - MkDocs Usage: MKDOCS_USAGE.md
  - GitHub Actions:
    - Overview: actions.md
    - Discord:
      - Discord Notify: actions/discord-notify.md
    - GitHub:
      - Step Summary: actions/step-summary.md
    - Red-DiscordBot:
      - Build: actions/build-red-discordbot.md
      - Install: actions/install-red-discordbot.md
      - Setup: actions/setup-red-discordbot.md
      - Test: actions/test-red-discordbot.md
      - Test-Downloader: actions/test-red-discordbot-downloader.md

  # - Versioning Strategy: VERSIONING.md
  # - ACT Testing:
  #     - Setup Guide: ACT_SETUP_GUIDE.md
  #     - Usage Guide: ACT_USAGE.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nntin/d-flows
  version:
    provider: mike

docs_dir: docs
site_dir: site

copyright: "Copyright &copy; 2025 Tin Nguyen"
